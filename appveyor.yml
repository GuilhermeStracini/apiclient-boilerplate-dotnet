version: 1.0.{build}
skip_tags: true
image: Visual Studio 2022
configuration: Release

environment:
  CODACY_PROJECT_TOKEN:
    secure: <secure token from Codacy>
  CODECLIMATE_TOKEN:
    secure: <secure token from CodeClimate>

dotnet_csproj:
  patch: true
  file: '**\*.props'
  version: "{version}"
  package_version: "{version}"
  assembly_version: "{version}"
  file_version: "{version}"
  informational_version: "{version}"

init:
  - SET JAVA_HOME=C:\Program Files\Java\jdk21
  - SET PATH=%JAVA_HOME%\bin;%PATH%

install:
  - ps: |
      if ($env:APPVEYOR_PULL_REQUEST_NUMBER -and $env:APPVEYOR_BUILD_NUMBER) {
          $historyUrl = "https://ci.appveyor.com/api/projects/$env:APPVEYOR_ACCOUNT_NAME/$env:APPVEYOR_PROJECT_SLUG/history?recordsNumber=50"
          $history = Invoke-RestMethod -Uri $historyUrl
          $latestBuild = ($history.builds | Where-Object pullRequestId -eq $env:APPVEYOR_PULL_REQUEST_NUMBER)[0].buildNumber
          if ($env:APPVEYOR_BUILD_NUMBER -ne $latestBuild) {
              throw "There are newer queued builds for this pull request, failing early."
          }
      }

before_build:
  - ps: |
      $slnFile = Get-ChildItem -Path .\* -Include *.sln | Select-Object -First 1
      $env:SOLUTION_NAME = [System.IO.Path]::GetFileNameWithoutExtension($slnFile.Name)
      $env:SONAR_PROJECT = "$env:APPVEYOR_REPO_NAME" -replace "/","_"
      $env:SONAR_ORGANIZATION = "$env:APPVEYOR_REPO_NAME" -replace "/.*$",""
      $env:LOCAL_PR = 0
      if (-Not $env:APPVEYOR_PULL_REQUEST_NUMBER) { $env:LOCAL_PR = 1 }
      if ($env:APPVEYOR_PULL_REQUEST_HEAD_REPO_NAME -eq $env:APPVEYOR_REPO_NAME -or -Not $env:APPVEYOR_PULL_REQUEST_HEAD_REPO_NAME) { $env:LOCAL_PR = 1 }
  - cmd: nuget restore
  - cmd: choco install opencover.portable -y
  - cmd: choco install codecov -y
  - cmd: curl -sL https://github.com/codacy/codacy-coverage-reporter/releases/latest/download/codacy-coverage-reporter-assembly.jar -o ./codacy-test-reporter.jar
  - cmd: curl -sL https://codeclimate.com/downloads/test-reporter/test-reporter-latest-windows-amd64 -o codeclimate-test-reporter.exe
  - cmd: dotnet tool install --global dotnet-sonarscanner

build: off

build_script:
  - ps: |
      $Params = @(
          "/k:`"$env:SONAR_PROJECT`"",
          "/o:`"$env:SONAR_ORGANIZATION`"",
          "/v:`"$env:APPVEYOR_BUILD_NUMBER`"",
          "/d:sonar.host.url=`"https://sonarcloud.io`""
      )
      if ($env:LOCAL_PR -eq 1 -and $env:SONAR_TOKEN) {
          $Params += "/d:sonar.token=`"$env:SONAR_TOKEN`""
      }
      $Params += "/d:sonar.exclusions=`"**/bin/**/*,**/obj/**/*`""
      $Params += "/d:sonar.coverage.exclusions=`"**/$env:SOLUTION_NAME.Tests/**,**/*Tests.cs`""
      $Params += "/d:sonar.cs.opencover.reportsPaths=`"$env:CD\Tests\**\coverage.net8.0.opencover.xml`""

      if (-Not $env:APPVEYOR_PULL_REQUEST_NUMBER) {
          $Params += "/d:sonar.branch.name=`"$env:APPVEYOR_REPO_BRANCH`""
      } else {
          $Params += "/d:sonar.pullrequest.key=$env:APPVEYOR_PULL_REQUEST_NUMBER"
          $Params += "/d:sonar.pullrequest.branch=`"$env:APPVEYOR_REPO_BRANCH`""
      }
      Start-Process "dotnet" "sonarscanner begin $($Params -join ' ')" -Wait
  - cmd: codeclimate-test-reporter before-build
  - cmd: dotnet build --verbosity minimal %SOLUTION_NAME%.sln
  - ps: |
      $TEST_PROJECTS = (Get-ChildItem -Path .\Tests\ -Recurse -Filter *.csproj).FullName
      foreach ($testProject in $TEST_PROJECTS) {
          dotnet test $testProject --no-build --verbosity minimal /p:CollectCoverage=true "/p:CoverletOutputFormat=\`"cobertura,opencover,lcov\`"" --logger:"junit;LogFilePath=test-results.xml"
          $projectDir = Split-Path $testProject
          $resultPath = Resolve-Path "$projectDir/test-results.xml" -ErrorAction SilentlyContinue
          if ($resultPath) {
              $uploadUrl = "https://ci.appveyor.com/api/testresults/xunit/$env:APPVEYOR_JOB_ID"
              Invoke-RestMethod -Uri $uploadUrl -Method Post -InFile $resultPath.Path -ContentType "application/xml"
          }
      }
  - ps: |
      if ($env:LOCAL_PR -eq 1) {
          & codecov -f "Tests\$env:SOLUTION_NAME.Tests\coverage.net8.0.opencover.xml"
          & .\codeclimate-test-reporter.exe format-coverage -t lcov -o "Tests\$env:SOLUTION_NAME.Tests\code-climate.json" "Tests\$env:SOLUTION_NAME.Tests\coverage.net8.0.info"
          Write-Host "Uploading coverage reports..."
          & .\codeclimate-test-reporter.exe upload-coverage -i "Tests\$env:SOLUTION_NAME.Tests\code-climate.json" -r $env:CODECLIMATE_TOKEN
          java -jar ./codacy-test-reporter.jar report -l CSharp -t $env:CODACY_PROJECT_TOKEN -r "Tests\$env:SOLUTION_NAME.Tests\coverage.net8.0.opencover.xml"
          dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
      } else {
          Write-Host "Skipping coverage upload due to forked PR"
      }

after_build:
  - cmd: echo refs > exclusions.txt
  - cmd: echo Generating binaries artifacts...
  - ps: |
      $VERSIONS = @("netstandard2.0", "netstandard2.1", "net6.0", "net8.0")
      $PROJECTS = @("EACH-PACKAGE/PROJECT-NAME")

      foreach ($version in $VERSIONS) {
          xcopy "Src\$env:SOLUTION_NAME\bin\Release\$version\*.*" "Build\Core\$version\" /s /f /e /r /k /y /EXCLUDE:exclusions.txt
          foreach ($project in $PROJECTS) {
              xcopy "Src\$env:SOLUTION_NAME.$project\bin\Release\$version\*.*" "Build\$project\$version\" /s /f /e /r /k /y /EXCLUDE:exclusions.txt
          }
      }

      copy "Src\$env:SOLUTION_NAME\bin\Release\$env:SOLUTION_NAME.$env:APPVEYOR_BUILD_VERSION.nupkg" "$env:SOLUTION_NAME.$env:APPVEYOR_BUILD_VERSION.nupkg"
      copy "Src\$env:SOLUTION_NAME\bin\Release\$env:SOLUTION_NAME.$env:APPVEYOR_BUILD_VERSION.snupkg" "$env:SOLUTION_NAME.$env:APPVEYOR_BUILD_VERSION.snupkg"

      foreach ($project in $PROJECTS) {
          copy "Src\$env:SOLUTION_NAME.$project\bin\Release\$env:SOLUTION_NAME.$project.$env:APPVEYOR_BUILD_VERSION.nupkg" "$env:SOLUTION_NAME.$project.$env:APPVEYOR_BUILD_VERSION.nupkg"
          copy "Src\$env:SOLUTION_NAME.$project\bin\Release\$env:SOLUTION_NAME.$project.$env:APPVEYOR_BUILD_VERSION.snupkg" "$env:SOLUTION_NAME.$project.$env:APPVEYOR_BUILD_VERSION.snupkg"
      }

      Get-ChildItem .\*.nupkg | ForEach-Object { Push-AppveyorArtifact $_.FullName -FileName $_.Name }
      Get-ChildItem .\*.snupkg | ForEach-Object { Push-AppveyorArtifact $_.FullName -FileName $_.Name }

  - cmd: rd /s /q "Src\%SOLUTION_NAME%\bin\Release\"
  - cmd: xcopy "Tests\%SOLUTION_NAME%.Tests\*.xml" "Coverage\" /I /Y
  - cmd: xcopy "Tests\%SOLUTION_NAME%.Tests\*.json" "Coverage\" /I /Y
  - cmd: xcopy "Tests\%SOLUTION_NAME%.Tests\*.info" "Coverage\" /I /Y
  - cmd: 7z a -tzip -mx9 "%SOLUTION_NAME%.%APPVEYOR_BUILD_VERSION%.Coverage.zip" Coverage
  - cmd: appveyor PushArtifact "%SOLUTION_NAME%.%APPVEYOR_BUILD_VERSION%.Coverage.zip"

  - ps: |
      foreach ($version in $VERSIONS) {
          $coreZip = "$env:SOLUTION_NAME.Core.$version.$env:APPVEYOR_BUILD_VERSION.zip"
          7z a -tzip -mx9 $coreZip "Build\Core\$version\"
          Push-AppveyorArtifact $coreZip

          foreach ($project in $PROJECTS) {
              $projZip = "$env:SOLUTION_NAME.$project.$version.$env:APPVEYOR_BUILD_VERSION.zip"
              7z a -tzip -mx9 $projZip "Build\$project\$version\"
              Push-AppveyorArtifact $projZip
          }
      }

test: off

deploy:
  - provider: NuGet
    api_key: $(NUGET_TOKEN)
    skip_symbols: false
    on:
      branch: main

  - provider: GitHub
    on:
      branch: main
    tag: v$(appveyor_build_version)
    description: Release of $(SOLUTION_NAME) - v$(appveyor_build_version)
    auth_token: $(GITHUB_TOKEN)
    force_update: true
    artifact: ZipFile, Package, Coverage
